name: CI de calidad del sitio

# El flujo se ejecuta en cada entrega o propuesta de cambio dirigida a main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Permisos minimos: solo se necesita lectura del repositorio.
permissions:
  contents: read

jobs:
  validar-sitio:
    name: Validar HTML, CSS y JavaScript
    runs-on: ubuntu-latest

    steps:
      # Descarga una copia completa del codigo para ejecutar las comprobaciones.
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      # Instala Node.js, necesario para ejecutar los linters y el chequeo de JavaScript.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Comprueba que los cuatro archivos principales del proyecto existan antes de validar.
      - name: Verificar archivos principales
        shell: bash
        run: |
          for archivo in index.html style.css script.js README.md LICENSE; do
            if [ ! -f "$archivo" ]; then
              echo "ERROR: falta el archivo requerido: $archivo"
              exit 1
            fi
          done
          echo "Todos los archivos principales existen."

      # Usa html-validate para detectar etiquetas mal cerradas, atributos invalidos y problemas basicos de HTML.
      - name: Validar HTML
        run: npx --yes html-validate@10 index.html

      # Usa Stylelint para revisar sintaxis y propiedades CSS conocidas o duplicadas.
      - name: Validar CSS
        run: npx --yes stylelint@16.12.0 style.css --config .stylelintrc.json

      # node --check analiza toda la sintaxis de JavaScript sin ejecutar el sitio ni modificar archivos.
      - name: Revisar sintaxis de JavaScript
        run: node --check script.js

      # Confirma que la validacion termino correctamente.
      - name: Resultado
        run: echo "Validacion de HTML, CSS y JavaScript completada."
